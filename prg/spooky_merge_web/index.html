<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=360, viewport-fit=cover">
  <meta name="theme-color" content="#100c20">
  <title>Spooky Merge — Seed7 Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <div class="moon" aria-hidden="true"></div>
    <header>
      <p class="eyebrow">A Seed7 browser game</p>
      <h1>Spooky<br><span>Merge</span></h1>
      <p class="intro">Drop, bump, and merge a little Halloween magic.</p>
    </header>
    <button id="start" type="button">Play</button>
    <p id="status" role="status">Use your mouse, keyboard, or touch.</p>
    <footer>Match two creatures to summon the next one.</footer>
  </main>
  <script src="launcher.js" defer></script>
</body>
</html>
